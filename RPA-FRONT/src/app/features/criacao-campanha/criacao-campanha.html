<div class="max-w-4xl mx-auto space-y-6">
  
  @if (!dadosPreview()) {
    <div class="bg-white shadow rounded-lg p-6">
      <h2 class="text-lg font-medium text-gray-900 mb-4">1. Importar Contatos (CSV)</h2>
      
      <app-file-upload (arquivoSelecionado)="processarArquivo($event)"></app-file-upload>
      
      @if (carregando()) {
        <div class="mt-4 text-center text-blue-600 font-medium">
          Processando planilha no servidor...
        </div>
      }
    </div>
  }

  @if (dadosPreview()) {
    <div class="bg-white shadow rounded-lg p-6">
      <h2 class="text-lg font-medium text-gray-900 mb-4">2. Mapear Colunas</h2>
      
      <p class="text-sm text-gray-500 mb-4">
        O arquivo <b>{{ arquivoAtual()?.name }}</b> tem {{ dadosPreview()!.colunas.length }} colunas. 
        Defina qual delas é o número do WhatsApp.
      </p>
      
      </div>
  }

</div>
