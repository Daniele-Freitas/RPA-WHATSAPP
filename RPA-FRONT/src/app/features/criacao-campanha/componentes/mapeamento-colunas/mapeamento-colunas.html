<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
  
  <div class="space-y-4">
    <div>
      <label for="selectTelefone" class="block text-sm font-medium text-gray-700 mb-1">
        Qual coluna contém o WhatsApp? <span class="text-red-500">*</span>
      </label>
      <select 
        id="selectTelefone"
        [value]="colunaTelefoneSelecionada()"
        (change)="atualizarSelecao('telefone', $event)"
        class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
        <option value="" disabled>Selecione uma coluna...</option>
        @for (coluna of dadosPreview().colunas; track coluna) {
          <option [value]="coluna">{{ coluna }}</option>
        }
      </select>
    </div>

    <div>
      <label for="selectNome" class="block text-sm font-medium text-gray-700 mb-1">
        Qual coluna contém o Nome? (Opcional)
      </label>
      <select 
        id="selectNome"
        [value]="colunaNomeSelecionada()"
        (change)="atualizarSelecao('nome', $event)"
        class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
        <option value="">Não usar nome</option>
        @for (coluna of dadosPreview().colunas; track coluna) {
          <option [value]="coluna">{{ coluna }}</option>
        }
      </select>
    </div>

    <button 
      (click)="confirmarMapeamento()"
      class="mt-4 w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
      Confirmar Mapeamento
    </button>
  </div>

  <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 overflow-x-auto">
    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">
      Amostra dos Dados (Primeiras Linhas)
    </h3>
    
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-100">
        <tr>
          @for (coluna of dadosPreview().colunas; track coluna) {
            <th class="px-3 py-2 text-left font-medium text-gray-700">{{ coluna }}</th>
          }
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 bg-white">
        @for (linha of dadosPreview().amostras; track $index) {
          <tr>
            @for (coluna of dadosPreview().colunas; track coluna) {
              <td class="px-3 py-2 text-gray-600 truncate max-w-xs">
                {{ linha[coluna] || '-' }}
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>

</div>
